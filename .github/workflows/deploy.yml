name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.py from repository secrets
        run: |
          cat > config.py << 'PYEOF'
          SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          VAPID_PUBLIC_KEY = "${{ secrets.VAPID_PUBLIC_KEY }}"
          PYEOF

      - name: Cache-bust style.css and app.py
        # Without this, phones (especially the installed PWA) can keep
        # serving an old cached copy of app.py/style.css indefinitely after
        # a deploy - every fix looks like it "didn't do anything" even
        # though the new bytes are live on Pages, because the browser
        # never re-requests them. Tying the query string to the commit SHA
        # forces a fresh fetch on every deploy.
        run: |
          sed -i "s/style\.css\"/style.css?v=${{ github.sha }}\"/" index.html
          sed -i "s/src=\"app\.py\"/src=\"app.py?v=${{ github.sha }}\"/" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
